<!-- ko if: item.mp_brand -->
<div class="mp-brand-item" data-bind="style: {'margin-top': '10px'}">
    <!-- ko if: item.brand_logo -->
    <div class="product-brand-logo">
        <a data-bind="attr: {href: item.brand_url}">
            <!-- ko if: item.swatch_type == 1 -->
            <img data-bind="style: {width: item.brand_width, height: item.brand_height, 'background-color': item.swatch_value}">
            <!-- /ko -->
            <!-- ko if: item.swatch_type != 1 -->
            <img data-bind="attr: {src: item.image_url, title: item.brand_value, alt: item.brand_value},
                            style: {width: item.brand_width, height: item.brand_height}">
            <!-- /ko -->
        </a>
    </div>
    <!-- /ko -->
    <!-- ko if: item.brand_name -->
    <div class="product-brand-name">
        <a data-bind="attr: {href: item.brand_url}">
            <span data-bind="attr: {title: item.brand_value}, html: item.brand_value"></span>
        </a>
    </div>
    <!-- /ko -->
    <!-- ko if: item.show_desc -->
    <div class="product-brand-desc">
        <p data-bind="html: item.short_desc"></p>
        <!-- ko if: item.desc_is_shorten -->
        <p>
            <a data-bind="attr: {href: item.product_url}">
                <i data-bind="i18n: 'Read more'"></i>
            </a>
        </p>
        <!-- /ko -->
    </div>
    <!-- /ko -->
</div>
<!-- /ko -->
