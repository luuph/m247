<!-- ko if: getBrand($parents[1]) -->
<div class="mp-brand-item">
    <!-- ko if: getBrand($parents[1]).image_url -->
    <div class="product-brand-logo">
        <a data-bind="attr: {href: getBrand($parents[1]).brand_url}">
            <img data-bind="attr: {src: getBrand($parents[1]).image_url, title: getBrand($parents[1]).brand_value, alt: getBrand($parents[1]).brand_value},
                            style: {width: getBrand($parents[1]).brand_width, height: getBrand($parents[1]).brand_height}">
        </a>
    </div>
    <!-- /ko -->
    <!-- ko if: getBrand($parents[1]).brand_name -->
    <div class="product-brand-name">
        <a data-bind="attr: {href: getBrand($parents[1]).brand_url}">
            <span data-bind="attr: {title: getBrand($parents[1]).brand_value}, html: getBrand($parents[1]).brand_value"></span>
        </a>
    </div>
    <!-- /ko -->
    <!-- ko if: getBrand($parents[1]).short_desc -->
    <div class="product-brand-desc">
        <p data-bind="html: getBrand($parents[1]).short_desc"></p>
        <!-- ko if: getBrand($parents[1]).desc_is_shorten -->
        <p>
            <a data-bind="attr: {href: getBrand($parents[1]).item_url}">
                <i data-bind="i18n: 'Read more'"></i>
            </a>
        </p>
        <!-- /ko -->
    </div>
    <!-- /ko -->
</div>
<!-- /ko -->
